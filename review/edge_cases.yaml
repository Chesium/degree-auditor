  - id: cc_tc_count_not_inflated
    description: >
      Three TCs read inside vacated CC pillars (ST/CN/SF) — total graduation units must remain
      160, not 160+12.
    why_this_matters: >
      The 3 TCs reallocate CC pillar / UE space; they do NOT add units on top of 160. An
      implementation that adds a separate 12-unit TC block would overcount. Verifies
      CC_TC_OVERFLOW_TO_UE / unit-neutrality (see metamorphic MP-21).
    assert_focus: CC_TC_OVERFLOW_TO_UE (unit-neutral substitution)
    transcript:
      courses:
        - {course_code: CDE2501, units: 4, status: completed, source: NUS}
        - {course_code: EE3131C, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: CDE2501, requirement_id: CC_GE_GESS, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3131C, requirement_id: CC_ISK_ST, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3131C, requirement_id: EE24JC_TC, units: 4, allocation_role: double_count, manual: true}
        - {course_code: EE3408C, requirement_id: CC_ISK_CN, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: double_count, manual: true}
        - {course_code: EE3331C, requirement_id: CC_ISK_SF, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: double_count, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings:
      - "3 TCs absorbed by ST/CN/SF pillars; degree total remains 160 units (not inflated)"
    source_refs:
      - {document: CTK, page: 7, quote: "You may utilize the following space in the CDE Common Curriculum to read the 3 additional TC"}
      - {document: FAQ, page: 2, quote: "you will need to use your unrestricted elective space to read additional 3 technical courses"}

