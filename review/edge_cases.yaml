# Edge cases — NUS EE AY24 JC degree auditor (implementation-blind contract fixtures)
#
# This file is the source of truth for the first black-box test pass. It is consumed by a
# harness (see review/black_box_test_plan.md §2) that runs the CLI and compares its JSON
# output against each case. The maintainer must make the CLI emit the IDs/fields defined in
# `meta` below. The authoritative rule/constraint definitions live in review/rule_inventory.md;
# this file only adds enums, the slot<->requirement mapping, and assertion semantics.

meta:
  schema_version: 2
  cohort: nus_ee_ay24_jc
  authoritative_registry: review/rule_inventory.md
  contract: "prompt.txt -> '## Contract & Assumptions (for the maintainer)'"

  # ---- Per-case schema (every case MUST have exactly these keys) ----
  case_schema:
    required: [id, description, why_this_matters, assert_focus, transcript,
               expected_pass, expected_failed_requirements, expected_failed_constraints,
               expected_warnings, source_refs]
    optional: [manual_allocation, config_overlay]
  field_docs:
    id: "unique snake_case identifier; also the pytest param id"
    assert_focus: "documentation only — names the rule/area expected_pass refers to; NOT asserted"
    transcript: "{ courses: [CourseAttempt], student_flags?: [Flag] }"
    manual_allocation: "{ allocations: [Allocation] } — when present, overrides greedy"
    config_overlay: "list of synthetic config fragments for merge tests only"
    expected_pass: "bool — pass/fail of the assert_focus area (fixtures are minimal; see scoping)"
    expected_failed_requirements: "list[RequirementId] — assertion is SUBSET (see assertion_semantics)"
    expected_failed_constraints: "list[ConstraintId] — assertion is SUBSET"
    expected_warnings: "list[str] — each entry must be a SUBSTRING of some emitted warning"
    source_refs: "list[{document, page|line|null, quote}] — provenance, not asserted"

  # ---- Enumerations (closed sets) ----
  enums:
    course_status: [completed, in_progress, planned]
    course_source: [NUS, SEP, APC, EXEMPTION, MANUAL]
    allocation_role: [primary, double_count, residual_ue, ignored]
    student_flag: [IDP, POLY, RC4, UTCP, NUSC, RVRC]

  # ---- Defaults applied when a field is omitted on a CourseAttempt ----
  defaults:
    units: 4
    status: completed
    source: NUS
    su: false
    topic_tags: []
    approved_for: []

  # ---- Assertion semantics (how the harness decides pass/fail) ----
  assertion_semantics:
    expected_pass: "compare to result.pass for the audited scope"
    failed_requirements: "set(expected_failed_requirements) <= set(result.failed_requirements)"
    failed_constraints: "set(expected_failed_constraints) <= set(result.failed_constraints)"
    warnings: "for each w in expected_warnings: any(w in m for m in result.warnings)"
    note: >
      Subset (not equality) so minimal fixtures need not enumerate every incidental failure.
      A case with empty expected_failed_* asserts only expected_pass + warnings.

  # ---- Allocation-target (slot) id  <->  reported requirement id ----
  # allocation.requirement_id uses the slot_id column; expected_failed_requirements uses the
  # requirement_id column. Where equal, the code may treat them as one id.
  slot_to_requirement:
    EE24JC_TC: TC_MIN_3
    EE24JC_TE: TE_MIN_2
    EE24JC_UE: UE_40
    EE24JC_MAJOR_DIGITAL: MAJ_DIGITAL_CHOICE
    EE24JC_MAJOR_EE2027: MAJ_EE2027
    MAJOR_INTERNSHIP: MAJOR_INTERNSHIP_10
    AE_CORE: AE_CORE
    AE_ELECTIVE: AE_ELECTIVES_MIN_3
    IND4_CORE: IND4_CORE
    IOT_CORE: IOT_CORE
    IOT_ELECTIVE: IOT_ELECTIVES_MIN_2_OR_8U
    MQM_CORE: MQM_CORE
    MQM_ELECTIVE: MQM_ELECTIVES_MIN_3_OR_12U
    RBT_BASKET: RBT_PATH1_CAPSTONE   # basket courses feed BOTH RBT_PATH1_CAPSTONE and RBT_PATH2_COURSEWORK
    RBT_CAPSTONE: RBT_PATH1_CAPSTONE  # capstone component of Path 1
    SET_ELECTIVE: SET_ELECTIVES_MIN_2
    SPT_CORE: SPT_CORE
    SPT_ELECTIVE: SPT_ELECTIVES_MIN_2
    CC_CAPSTONE: CC_CAPSTONE
    CC_GE_GESS: CC_GE_GESS
    CC_ISK_ST: CC_ISK_ST
    CC_ISK_CN: CC_ISK_CN
    CC_ISK_SF: CC_ISK_SF
    IDP_2ND_MAJOR: IDP_2ND_MAJOR     # out of scope; present only for CDE4301 conflict test

  # Reported requirement ids that have NO allocation slot (evaluated, not allocated-to):
  reported_only_requirements:
    - RBT_PATH2_COURSEWORK   # Robotics coursework-only path; fed by the RBT_BASKET slot
    - DEG_TOTAL_160
    - CC_CDE_60
    - MAJOR_60
    - MAJ_EE2027
    - IDP_2ND_MAJOR

  # ---- Constraint ids exercised by these cases (full definitions in rule_inventory.md) ----
  constraint_ids_used:
    - ALIAS_DUPLICATE_CREDIT
    - CAP_LOCK
    - CC_RC_EXCLUSION
    - CDE4301_NO_SPEC_IF_IDP
    - CONFIG_MERGE_CONFLICT
    - DOUBLE_USE_SINGLE_INSTANCE
    - LVL1000_MAX_60
    - MAJOR_INTERNSHIP_CEG_ONLY
    - MAJOR_INTERNSHIP_UROP_CAP
    - MANUAL_ALLOC_INELIGIBLE
    - MANUAL_ALLOC_INVALID
    - PILLAR_OVER_ALLOCATED
    - SEP_CAPSTONE_FORBIDS_SEP
    - SEP_RESIDENCY_50
    - SEP_SPEC_MAX_8
    - SEP_SPEC_NO_REUSE
    - SEP_TE_MAX_ONE_MAPPED
    - SEP_TE_ONE_NUS
    - SPEC_MAX_OVERLAP_8
    - SPEC_OVERLAP_SINGLE_INSTANCE
    - SPT_EG4301_NOT_COUNTED
    - TC_EFFECTIVE_DATE_EE3033
    - TC_NOT_TE
    - TE_EXCLUDE_EE3031
    - TE_EXCLUDE_EE3033
    - TE_EXCLUDE_NON_EE

  source_ref_documents:
    CHK: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
    SPC: ECE_Specialisations_AY2025_7July2025.pdf
    PRM: prompt.txt
    TCL: Electrical-Engineering-List-of-Additional-Technical-Courses-v3.pdf
    FAQ: FAQ for In-Flight students_For AY24 Non Poly_17Jun2025.pdf
    GRB: EE2_Revised Grad Req Briefing_20June25.pdf
    CTK: EE2_Curriculum_Talk_2025_13Aug2025.pdf
    TE26: EE_TechElectives_AY2026_iii.pdf
    SEP: ECE_SEP_Outgoing_AY2627_30Jan26.pdf
    IAW: "https://cde.nus.edu.sg/undergraduate/engineering-internships/student-info/"
    review: review/*.md

cases:
  - id: major_core_pass_basic
    description: >
      Student completed all fixed EE major core courses, one of EE2026/EE2028,
      and 2 valid NUS TEs.
    why_this_matters: >
      Baseline happy path. If this fails, requirement satisfaction or unit
      accounting is broken before any edge logic is reached.
    assert_focus: MAJ_* and TE_MIN_2 (Major Programme block)
    transcript:
      courses:
        - {course_code: EE1111A, units: 4, status: completed, source: NUS}
        - {course_code: EE2111A, units: 4, status: completed, source: NUS}
        - {course_code: EE2012, units: 4, status: completed, source: NUS}
        - {course_code: EE2022, units: 4, status: completed, source: NUS}
        - {course_code: EE2023, units: 4, status: completed, source: NUS}
        - {course_code: EE2027, units: 4, status: completed, source: NUS}
        - {course_code: PC2020, units: 4, status: completed, source: NUS}
        - {course_code: EE2028, units: 4, status: completed, source: NUS}
        - {course_code: EE4301, units: 4, status: completed, source: NUS}
        - {course_code: EE4307, units: 4, status: completed, source: NUS}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings: []
    source_refs:
      - {document: CHK, page: 2, quote: "Major Programme: 40 units ... Two EE Technical Electives"}
      - {document: PRM, line: 294, quote: "Include: EE1111A ... 2 EE Technical Electives"}

  - id: tc_te_mutual_exclusion_fail
    description: >
      Single EE3xxxC course (EE3331C) manually allocated to BOTH TC and TE.
    why_this_matters: >
      Core source-aware constraint. The same course-units may not satisfy TC and
      TE concurrently; this is the most fundamental separation rule for this cohort.
    assert_focus: TC_NOT_TE / TE_MUTEX_TC
    transcript:
      courses:
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: []
    expected_failed_constraints: [TC_NOT_TE]
    expected_warnings:
      - "EE3331C allocated to both TC and TE; mutual exclusion violated"
    source_refs:
      - {document: CHK, page: 3, quote: "Courses used to fulfil T.C rule, cannot be used to fulfil T.E rule, and v.v."}
      - {document: CHK, page: 1, quote: "Technical Course (T.C) is not Technical Elective (T.E)"}

  - id: ee2026_ee2028_choice_tc_success
    description: >
      EE2028 used for the Major digital/microcontroller choice; EE2026 used for TC.
    why_this_matters: >
      The course NOT chosen for the Major must become TC-eligible. Validates the
      choice group + conditional TC eligibility coupling.
    assert_focus: MAJ_DIGITAL_CHOICE + TC_POOL (unused EE2026/EE2028)
    transcript:
      courses:
        - {course_code: EE2028, units: 4, status: completed, source: NUS}
        - {course_code: EE2026, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE2028, requirement_id: EE24JC_MAJOR_DIGITAL, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE2026, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings: []
    source_refs:
      - {document: CHK, page: 1, quote: "EE2026 or EE2028 (whichever not taken to fulfil EE Major)"}
      - {document: PRM, line: 304, quote: "The course not used for the major may be eligible for TC."}

  - id: ee2026_both_to_major_and_tc_fail
    description: >
      EE2026 allocated to BOTH the Major digital choice and TC, while EE2028 is absent.
    why_this_matters: >
      The unused-course condition is what makes EE2026/EE2028 TC-eligible. The same
      instance cannot be both the major choice and the TC simultaneously.
    assert_focus: MAJ_DIGITAL_CHOICE vs TC_POOL conditional
    transcript:
      courses:
        - {course_code: EE2026, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE2026, requirement_id: EE24JC_MAJOR_DIGITAL, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE2026, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_constraints: [DOUBLE_USE_SINGLE_INSTANCE]
    expected_failed_requirements: []
    expected_warnings:
      - "EE2026 cannot fulfil both Major digital choice and TC; TC eligibility requires the OTHER course"
    source_refs:
      - {document: CHK, page: 1, quote: "EE2026 or EE2028 (whichever not taken to fulfil EE Major)"}

  - id: ee3031_not_te_fail
    description: EE3031 manually allocated as a TE.
    why_this_matters: >
      EE3031 is explicitly UE-only for AY2021-AY2024 intake and must never count as TE.
    assert_focus: TE_EXCLUDE_EE3031
    transcript:
      courses:
        - {course_code: EE3031, units: 4, status: completed, source: NUS}
        - {course_code: EE4301, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3031, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: [TE_MIN_2]
    expected_failed_constraints: [TE_EXCLUDE_EE3031]
    expected_warnings:
      - "EE3031 can only fulfil UE for AY2021-AY2024 intake, not the TE rule"
    source_refs:
      - {document: CHK, page: 2, quote: "EE3031 can only fulfil UE for students of AY2021-AY2024 intake, not T.E rule"}

  - id: ee3031_as_ue_pass
    description: EE3031 allocated to residual UE only.
    why_this_matters: >
      Confirms the exclusion is TE-specific, not a blanket ban; EE3031 is valid UE.
    assert_focus: UE_RESIDUAL acceptance of EE3031
    transcript:
      courses:
        - {course_code: EE3031, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3031, requirement_id: EE24JC_UE, units: 4, allocation_role: residual_ue, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings: []
    source_refs:
      - {document: CHK, page: 2, quote: "EE3031 can only fulfil UE ... not T.E rule"}

  - id: ee3033_not_te_fail
    description: EE3033 manually allocated as a TE.
    why_this_matters: >
      EE3033 is explicitly excluded from the TE pool; it belongs to the TC pool only.
    assert_focus: TE_EXCLUDE_EE3033
    transcript:
      courses:
        - {course_code: EE3033, units: 4, status: completed, source: NUS, term: "AY2025-2026 S2"}
    manual_allocation:
      allocations:
        - {course_code: EE3033, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: [TE_MIN_2]
    expected_failed_constraints: [TE_EXCLUDE_EE3033]
    expected_warnings:
      - "EE3033 is not a Technical Elective (TC pool only)"
    source_refs:
      - {document: CHK, page: 2, quote: "EE3xxx (does not include EE3033)"}

  - id: ee3033_tc_before_effective_date_warn
    description: EE3033 used as TC with term AY2025-2026 S1 (before wef Sem2 AY25/26).
    why_this_matters: >
      The effective date (wef Sem2 AY25/26) gates EE3033 TC-eligibility; an earlier
      term must not silently pass. See ambiguity A-04.
    assert_focus: TC_EFFECTIVE_DATE_EE3033
    transcript:
      courses:
        - {course_code: EE3033, units: 4, status: completed, source: NUS, term: "AY2025-2026 S1"}
    manual_allocation:
      allocations:
        - {course_code: EE3033, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_constraints: [TC_EFFECTIVE_DATE_EE3033]
    expected_failed_requirements: []
    expected_warnings:
      - "EE3033 is TC-eligible only from Semester 2 AY2025/26; attempt term precedes this"
    source_refs:
      - {document: CHK, page: 1, quote: "EE3033 Systems Integration and Design (wef sem2 AY25/26)"}

  - id: ee3033_tc_on_effective_date_pass
    description: EE3033 used as TC with term AY2025-2026 S2 (exactly the effective semester).
    why_this_matters: Boundary test for the effective-date predicate (>= not >).
    assert_focus: TC_EFFECTIVE_DATE_EE3033 boundary
    transcript:
      courses:
        - {course_code: EE3033, units: 4, status: completed, source: NUS, term: "AY2025-2026 S2"}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3033, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings: []
    source_refs:
      - {document: CHK, page: 1, quote: "EE3033 ... (wef sem2 AY25/26)"}
  - id: tc_only_3_courses_pass
    description: Three valid TCs (EE3131C, EE3408C, EE3731C) plus two distinct TEs.
    why_this_matters: >
      TC minimum is 3 (count) and is additive to the 2-TE rule. Confirms the two
      counters are independent and additive.
    assert_focus: TC_MIN_3 + TE_MIN_2 (additive)
    transcript:
      courses:
        - {course_code: EE3131C, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3731C, units: 4, status: completed, source: NUS}
        - {course_code: EE4101, units: 4, status: completed, source: NUS}
        - {course_code: EE4302, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3131C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3731C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4101, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4302, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings: []
    source_refs:
      - {document: CHK, page: 1, quote: "AY24 intake (JC/non-poly): Read 3 T.C ... in addition to the EE Technical Elective rule (of 2 T.Es)"}

  - id: tc_only_2_courses_fail
    description: Only 2 TCs allocated; transcript has no third TC-eligible course.
    why_this_matters: Off-by-one on the TC minimum (3) is a likely implementation bug.
    assert_focus: TC_MIN_3
    transcript:
      courses:
        - {course_code: EE3131C, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3131C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: [TC_MIN_3]
    expected_failed_constraints: []
    expected_warnings:
      - "Technical Courses: 2 / 3 completed"
    source_refs:
      - {document: CHK, page: 1, quote: "3 T.C is the minimum"}

  - id: ae_core_overlap_with_tc_within_budget
    description: >
      EE3408C and EE3431C allocated to AE core; EE3408C also allocated to TC.
      AE overlap = 4 units (<= 8).
    why_this_matters: >
      Validates that double-counting an extended-core course between AE and TC is
      allowed while within the 8-unit overlap budget.
    assert_focus: AE_CORE + SPEC_MAX_OVERLAP_8
    transcript:
      courses:
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3431C, units: 4, status: completed, source: NUS}
        - {course_code: EE4407, units: 4, status: completed, source: NUS}
        - {course_code: EE4415, units: 4, status: completed, source: NUS}
        - {course_code: EE4409, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3408C, requirement_id: AE_CORE, units: 4, allocation_role: double_count, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3431C, requirement_id: AE_CORE, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4407, requirement_id: AE_ELECTIVE, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4415, requirement_id: AE_ELECTIVE, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4409, requirement_id: AE_ELECTIVE, units: 4, allocation_role: primary, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings:
      - "AE overlap budget: 4 / 8 units used"
    source_refs:
      - {document: SPC, page: 5, quote: "Core (Compulsory) EE3408C ... EE3431C ... Choose at least 3 electives"}
      - {document: SPC, page: 1, quote: "up to 8 Units (40%) ... may be double counted"}

  - id: ae_core_tc_te_conflict
    description: EE3408C allocated to AE core, TC, and TE simultaneously.
    why_this_matters: >
      Even when overlap budget allows AE+TC, the TC<->TE mutual exclusion must still
      fire. Tests that mutual exclusion is checked independently of overlap budget.
    assert_focus: TC_NOT_TE (independent of SPEC overlap)
    transcript:
      courses:
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3408C, requirement_id: AE_CORE, units: 4, allocation_role: double_count, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TE, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: []
    expected_failed_constraints: [TC_NOT_TE]
    expected_warnings:
      - "EE3408C cannot be used for both TC and TE"
    source_refs:
      - {document: CHK, page: 3, quote: "Courses used to fulfil T.C rule, cannot be used to fulfil T.E rule, and v.v."}

  - id: robotics_coursework_only_pass
    description: 20 units (5 courses) from the Robotics basket, no capstone.
    why_this_matters: Validates Robotics Path 2 (coursework-only) independent of capstone path.
    assert_focus: RBT_PATH2_COURSEWORK
    transcript:
      courses:
        - {course_code: EE3305, units: 4, status: completed, source: NUS}
        - {course_code: EE4308, units: 4, status: completed, source: NUS}
        - {course_code: EE4309, units: 4, status: completed, source: NUS}
        - {course_code: EE4311, units: 4, status: completed, source: NUS}
        - {course_code: EE4705, units: 4, status: completed, source: NUS}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings:
      - "Robotics path selected: COURSEWORK_ONLY (20/20 units)"
    source_refs:
      - {document: SPC, page: 8, quote: "(ii) Choose 20 Units from basket of Robotics electives"}

  - id: robotics_capstone_path_pass
    description: 12 units Robotics electives + EE4002D tagged robotics (capstone path).
    why_this_matters: Validates Robotics Path 1 and topic-tag recognition on the capstone.
    assert_focus: RBT_PATH1_CAPSTONE + topic_tags
    transcript:
      courses:
        - {course_code: EE3305, units: 4, status: completed, source: NUS}
        - {course_code: EE4308, units: 4, status: completed, source: NUS}
        - {course_code: EE4309, units: 4, status: completed, source: NUS}
        - {course_code: EE4002D, units: 8, status: completed, source: NUS, topic_tags: [robotics]}
    manual_allocation:
      allocations:
        - {course_code: EE3305, requirement_id: RBT_BASKET, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4308, requirement_id: RBT_BASKET, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE4309, requirement_id: RBT_BASKET, units: 4, allocation_role: primary, manual: true}
