      - {document: GRB, page: 10, quote: "If you have not taken a GESS course, CDE2501 will be count towards the Singapore Studies (SS) pillar. You may read 1 TC in lieu of Sustainable Futures"}

  - id: cc_cde2501_to_sf_with_gess_pass
    description: >
      A GESS course is taken (fills Singapore Studies); CDE2501 fills Sustainable Futures;
      the third TC therefore must be read using UE (not the SF pillar).
    why_this_matters: >
      The other CDE2501 branch: when GESS is taken, SF is occupied by CDE2501 so no TC may go
      to SF; the third TC overflows to UE. Verifies CC_CDE2501_DUAL_ROLE branch (b) and
      CC_TC_OVERFLOW_TO_UE.
    assert_focus: CC_CDE2501_DUAL_ROLE (b) + CC_TC_OVERFLOW_TO_UE
    transcript:
      courses:
        - {course_code: GESS1001, units: 4, status: completed, source: NUS}
        - {course_code: CDE2501, units: 4, status: completed, source: NUS}
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3431C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: GESS1001, requirement_id: CC_GE_GESS, units: 4, allocation_role: primary, manual: true}
        - {course_code: CDE2501, requirement_id: CC_ISK_SF, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3431C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3431C, requirement_id: EE24JC_UE, units: 4, allocation_role: residual_ue, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings:
      - "GESS taken; CDE2501 counted under Sustainable Futures; third TC read using UE"
    source_refs:
      - {document: FAQ, page: 2, quote: "the General Education (GESS) course will fulfil the Singapore Studies Pillar, while CDE2501 will be counted under the Sustainable Futures Pillar"}
      - {document: GRB, page: 10, quote: "you cannot use SF pillar for TC, you will read 1 TC using UE space"}

  - id: cc_double_count_cde2501_fail
    description: CDE2501 allocated to BOTH the Singapore Studies and Sustainable Futures pillars.
    why_this_matters: >
      CDE2501 may occupy only one pillar. Counting it under both SS and SF would fabricate
      4 units. Verifies CC_CDE2501_DUAL_ROLE single-instance constraint.
    assert_focus: CC_CDE2501_DUAL_ROLE (no double-count)
    transcript:
      courses:
        - {course_code: CDE2501, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: CDE2501, requirement_id: CC_GE_GESS, units: 4, allocation_role: primary, manual: true}
        - {course_code: CDE2501, requirement_id: CC_ISK_SF, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: []
    expected_failed_constraints: [DOUBLE_USE_SINGLE_INSTANCE]
    expected_warnings:
      - "CDE2501 cannot satisfy both Singapore Studies and Sustainable Futures pillars"
    source_refs:
      - {document: FAQ, page: 2, quote: "CDE2501 remains a compulsory course ... counted under the Sustainable Futures Pillar"}

  - id: cc_tc_in_lieu_ie2141_pass
    description: >
      IE2141 not taken; a TC (EE3131C) fills the Systems Thinking pillar and also counts to
      the TC requirement.
    why_this_matters: >
      Verifies CC_TC_IN_LIEU_ST: a TC may replace IE2141 in the Systems Thinking pillar, and
      that course simultaneously contributes to the TC requirement (intended double-use across
      CC pillar + TC, not TC<->TE).
    assert_focus: CC_TC_IN_LIEU_ST
    transcript:
      courses:
        - {course_code: EE3131C, units: 4, status: completed, source: NUS}
        - {course_code: EE3408C, units: 4, status: completed, source: NUS}
        - {course_code: EE3331C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: EE3131C, requirement_id: CC_ISK_ST, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3131C, requirement_id: EE24JC_TC, units: 4, allocation_role: double_count, manual: true}
        - {course_code: EE3408C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3331C, requirement_id: EE24JC_TC, units: 4, allocation_role: primary, manual: true}
    expected_pass: true
    expected_failed_requirements: []
    expected_failed_constraints: []
    expected_warnings:
      - "Systems Thinking pillar satisfied by TC in lieu of IE2141"
    source_refs:
      - {document: FAQ, page: 1, quote: "you may take (*EE2026 or *EE2028), EE3033 and 1 extended core EE3xxxC courses in lieu of the Systems Thinking pillar"}
      - {document: GRB, page: 4, quote: "you can read an additional technical course to satisfy the Systems Thinking pillar in lieu of IE2141"}

  - id: cc_ie2141_and_tc_both_in_st_fail
    description: IE2141 taken AND a TC also claimed for the Systems Thinking pillar.
    why_this_matters: >
      The substitution is mutually exclusive: if IE2141 is taken it already fills Systems
      Thinking, so a TC cannot also occupy that pillar (over-allocation). Verifies the XOR in
      CC_TC_IN_LIEU_ST.
    assert_focus: CC_TC_IN_LIEU_ST (IE2141 XOR TC-in-ST)
    transcript:
      courses:
        - {course_code: IE2141, units: 4, status: completed, source: NUS}
        - {course_code: EE3131C, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: IE2141, requirement_id: CC_ISK_ST, units: 4, allocation_role: primary, manual: true}
        - {course_code: EE3131C, requirement_id: CC_ISK_ST, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: []
    expected_failed_constraints: [PILLAR_OVER_ALLOCATED]
    expected_warnings:
      - "Systems Thinking pillar already satisfied by IE2141; TC cannot also fill it"
    source_refs:
      - {document: GRB, page: 4, quote: "If you have not already read IE2141 ... you can read an additional technical course ... in lieu of IE2141"}

