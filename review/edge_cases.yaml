        - {course_code: CDE2605, requirement_id: MAJOR_INTERNSHIP, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: [MAJOR_INTERNSHIP_10]
    expected_failed_constraints: []
    expected_warnings:
      - "Major internship: 8 / 10 units; combination is short of 10"
    source_refs:
      - {document: CHK, page: 2, quote: "take a combination of the following to satisfy the 10 units"}

  - id: internship_urop_cap_fail
    description: >
      UROP + UREx (CDE2605 4u + CDE2605R 4u) used to claim 8 internship units, plus EG3612 (6u),
      claiming 8 UROP-units toward the 10-unit major requirement.
    why_this_matters: >
      At most 4 units of UROP/UREx may count toward the major internship; the second 4 must go
      to UE. Relying on 8 UROP units for the major requirement must fail MAJOR_INTERNSHIP_UROP_CAP.
    assert_focus: MAJOR_INTERNSHIP_UROP_CAP
    transcript:
      courses:
        - {course_code: CDE2605, units: 4, status: completed, source: NUS}
        - {course_code: CDE2605R, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
        - {course_code: CDE2605, requirement_id: MAJOR_INTERNSHIP, units: 4, allocation_role: primary, manual: true}
        - {course_code: CDE2605R, requirement_id: MAJOR_INTERNSHIP, units: 4, allocation_role: primary, manual: true}
    expected_pass: false
    expected_failed_requirements: [MAJOR_INTERNSHIP_10]
    expected_failed_constraints: [MAJOR_INTERNSHIP_UROP_CAP]
    expected_warnings:
      - "At most 4 units of UROP/UREx count toward the major internship; excess goes to UE"
    source_refs:
      - {document: IAW, page: null, quote: "A maximum of 4 units from UROP/UREx can count towards the major internship requirement"}

