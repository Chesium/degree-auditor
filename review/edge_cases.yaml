  - id: internship_short_combo_fail
    description: CFG2101 (4u) + CDE2605 UROP (4u) = 8 units; short of the 10-unit requirement.
    why_this_matters: >
      A combination must reach 10 units. 4+4=8 is short and must fail, even though both are
      valid internship courses. Guards against "any two internship courses pass" bugs.
    assert_focus: MAJOR_INTERNSHIP_COMBO (must reach 10u)
    transcript:
      courses:
        - {course_code: CFG2101, units: 4, status: completed, source: NUS}
        - {course_code: CDE2605, units: 4, status: completed, source: NUS}
    manual_allocation:
      allocations:
