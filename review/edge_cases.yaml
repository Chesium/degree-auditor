      picking one, which would corrupt the rule set.
    assert_focus: CFG_MERGE_BY_ID (conflict)
    transcript:
      courses: []
    config_overlay:
      - {file: robotics.yaml, requirement: {id: RBT_PATH1_CAPSTONE, min_units: 12}}
      - {file: robotics_alt.yaml, requirement: {id: RBT_PATH1_CAPSTONE, min_units: 16}}
    expected_pass: false
    expected_failed_constraints: [CONFIG_MERGE_CONFLICT]
    expected_failed_requirements: []
    expected_warnings:
      - "Conflicting definitions for id RBT_PATH1_CAPSTONE; set override: true to resolve"
    source_refs:
      - {document: PRM, line: 213, quote: "If two objects with the same id conflict, fail fast with a clear error unless an explicit override: true is set."}

