    description: Complete at least three Technical Courses in addition to the EE Technical Elective rule.
    requirement_type: pool_count
    pool_id: EE24JC_TC_POOL
    min_count: 3
    units: 12
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Technical Courses
      quote: "AY24 intake (JC/ non-poly): Read 3 T.C"
