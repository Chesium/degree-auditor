constraints:
  - id: EE24JC_MAJOR_CORE_COMPLETE
    description: EE Major fixed core courses must all be completed or planned in the transcript.
    constraint_type: major_core_complete
    params:
      requirement_id: EE24JC_MAJOR_CORE
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Major Requirements
      quote: Major Requirements 60 units
      notes: The prototype checks presence of the listed fixed EE major core courses in the transcript.
  - id: EE24JC_MAJOR_CHOICE_EXACTLY_ONE
    description: Exactly one of EE2026 or EE2028 must fulfil the EE major digital/microcontroller choice.
    constraint_type: major_choice_exactly_one
    params:
      requirement_id: EE24JC_MAJOR_DIGITAL_CHOICE
      courses:
        - EE2026
        - EE2028
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Major Requirements
      quote: EE2026 Digital Design or EE2028 Microcontroller Programming and Interfacing
      notes: The course not used for this major choice may be eligible for TC.
  - id: EE24JC_TC_MIN_3
    description: AY2024 JC/non-poly intake must complete at least three Technical Courses.
    constraint_type: min_count
    params:
      requirement_id: EE24JC_TC
      min_count: 3
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Technical Courses
      quote: Read 3 T.C
      notes: Three TC is the minimum.
  - id: EE24JC_TE_MIN_2
    description: EE Major requires at least two Technical Electives.
    constraint_type: min_count
    params:
      requirement_id: EE24JC_TE
      min_count: 2
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Major Requirements
      quote: Two EE Technical Electives
      notes: The TC rule is in addition to this TE rule.
  - id: EE24JC_TC_TE_MUTUAL_EXCLUSION
    description: Technical Course and Technical Elective allocations must be mutually exclusive.
    constraint_type: mutual_exclusion
    params:
      requirement_ids:
        - EE24JC_TC
        - EE24JC_TE
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Technical Courses
      quote: Course counted towards fulfilling the TC requirement cannot be used to fulfil the Technical Elective (TE) requirement concurrently.
      notes: Applies even when a course is eligible for both pools.
  - id: EE24JC_TC_ELIGIBILITY
    description: TC allocations must be from the TC pool, and EE2026 or EE2028 may count only when not used for the EE major choice.
    constraint_type: tc_eligibility
    params:
      requirement_id: EE24JC_TC
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Technical Courses
      quote: EE2026 or EE2028 (whichever not taken to fulfil EE Major)
      notes: This is evaluated against the selected major digital/microcontroller choice.
  - id: EE24JC_TE_ELIGIBILITY
    description: TE allocations must match EE4xxx, EE3xxxC, or EE3xxx and must not be EE3033 or EE3031.
    constraint_type: te_eligibility
    params:
      requirement_id: EE24JC_TE
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Major Requirements
      quote: EE3xxx does not include EE3033; EE3031 can only fulfil UE for students of AY2021-AY2024 intake, not T.E rule.
      notes: The prototype treats both exclusions as hard TE eligibility failures.
  - id: EE24JC_TE_SEP_ONE_NUS
    description: At least one qualifying EE3xxxC or EE4xxx TE must be completed at NUS.
    constraint_type: te_sep_one_nus
    params:
      requirement_id: EE24JC_TE
      qualifying_patterns:
        - EE3xxxC
        - EE4xxx
    source_ref:
      document: prompt.txt
      page: null
      section: SEP rules
      quote: At least one TE, either EE3xxxC or EE4xxx, must be completed at NUS.
      notes: Source text records the SEP special rule for Major TE.
  - id: EE24JC_TE_SEP_MAX_ONE
    description: At most one SEP-mapped EE3xxxC or EE4xxx may fulfil Major TE.
    constraint_type: te_sep_max_one
    params:
      requirement_id: EE24JC_TE
      qualifying_patterns:
        - EE3xxxC
        - EE4xxx
      max_sep_count: 1
    source_ref:
      document: prompt.txt
      page: null
      section: SEP rules
      quote: At most one SEP-mapped EE3xxxC/EE4xxx may be used to fulfil Major TE.
      notes: Only approved SEP mappings count positively.
  - id: EE_SPEC_SEP_NO_REUSE
    description: The same approved SEP course must not be mapped to more than one specialisation.
    constraint_type: specialisation_sep_no_reuse
    params:
      scope: specialisations
    source_ref:
      document: prompt.txt
      page: null
      section: SEP rules
      quote: A SEP course approved for one Specialisation should not be mapped again to another Specialisation or Minor.
      notes: Minor checks are out of scope for this prototype pass; cross-specialisation reuse is enforced.
  - id: SEP_RESIDENCY_50
    description: At least 50% of overall attempted units must be read at NUS.
    constraint_type: sep_residency_50
    params:
      min_ratio: 0.5
    source_ref:
      document: ECE_SEP_Outgoing_AY2627_30Jan26.pdf
      page: 2
      section: SEP residency
      quote: "Residency requirements: Minimum 50% of overall courses must be read in NUS"
      notes: Implemented as a unit ratio over transcript attempts in Pass 15.
  - id: SEP_PROGRAMME_60
    description: At least 60% of allocated non-UE programme requirement units must be read at NUS.
    constraint_type: sep_programme_60
    params:
      min_ratio: 0.6
    source_ref:
      document: ECE_SEP_Outgoing_AY2627_30Jan26.pdf
      page: 2
      section: SEP residency
      quote: Residency requirements include a minimum percentage of programme requirements read at NUS.
      notes: Prototype denominator is explicit allocated non-UE audited requirement units.
  - id: SEP_MAY_MAP_TC
    description: AY23/AY24 intake students may map approved SEP courses to the TC requirement.
    constraint_type: sep_may_map_tc
    params:
      requirement_id: EE24JC_TC
    source_ref:
      document: ECE_SEP_Outgoing_AY2627_30Jan26.pdf
      page: 2
      section: SEP to TC mapping
      quote: AY23 and AY24 intake students may take SEP courses to map to Technical Course (TC) requirements
      notes: Cohort is fixed to AY24 JC/non-poly in this prototype.
  - id: TE_EXCLUDE_NON_EE
    description: Non-EE courses cannot fulfil the EE Technical Elective rule.
    constraint_type: te_exclude_non_ee
    params:
      requirement_id: EE24JC_TE
    source_ref:
      document: EE_TechElectives_AY2026_iii.pdf
      page: 4
      section: Notes
      quote: Non-EE courses count towards UE requirements only. They cannot be used to fulfil EE Tech elective rules.
      notes: Applies even when a non-EE course is cross-listed with an EE course.
  - id: TC_EFFECTIVE_DATE_EE3033
    description: EE3033 is TC-eligible only from Semester 2 AY2025/26.
    constraint_type: tc_effective_date_ee3033
    params:
      course: EE3033
      earliest_term: AY2025-2026 S2
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Technical Courses
      quote: EE3033 Systems Integration and Design (wef sem2 AY25/26)
  - id: ALIAS_DUPLICATE_CREDIT
    description: Cross-listed aliases cannot be credited as distinct course instances for the same requirement.
    constraint_type: alias_duplicate_credit
    source_ref:
      document: ECE_Specialisations_AY2025_7July2025.pdf
      page: 6
      section: Cross-listed courses
      quote: EE3306/ME3163 Introduction to Cyber Physical Systems
      notes: Also applies to EE3305/ME3243 and EE3331C/ME3142.
  - id: MANUAL_ALLOC_INELIGIBLE
    description: Manual allocations must still match the configured requirement or basket eligibility.
    constraint_type: manual_alloc_ineligible
    source_ref:
      document: review
      page: null
      section: Black-box review
      quote: Manual allocation cannot bypass eligibility.
      notes: Used for review-contract cases where a public slot id is supplied directly.
  - id: CDE4301_NO_SPEC_IF_IDP
    description: CDE4301/CDE4301A used for the iDP Second Major cannot also fulfil an EE Specialisation.
    constraint_type: cde4301_no_spec_if_idp
    source_ref:
      document: review
      page: null
      section: Ambiguity A-16
      quote: CDE4301/CDE4301A cannot be used to fulfil a specialisation if also used to fulfil the Second Major in Innovation & Design.
      notes: Distinct from the EE4002D/R capstone overlap lock.
  - id: SPT_EG4301_NOT_COUNTED
    description: EG4301 units must not count toward the Space Technology Specialisation.
    constraint_type: spt_eg4301_not_counted
    source_ref:
      document: ECE_Specialisations_AY2025_7July2025.pdf
      page: 8
      section: Space Technology
      quote: the Units from the FYP course will not be counted towards this Specialisation to avoid triple counting
      notes: Applies to iDP students where EG4301 may be topic-related but is excluded from SPT units.
  - id: SPEC_OVERLAP_SINGLE_INSTANCE
    description: A single EE4002D or EE4002R capstone instance cannot fulfil multiple capstone-sensitive specialisations.
    constraint_type: spec_overlap_single_instance
    source_ref:
      document: ECE_Specialisations_AY2025_7July2025.pdf
      page: 1
      section: Specialisation overlap and capstone lock
      quote: At least 12 Units of the Specialisation must be distinct and not overlapping.
      notes: Applied when one capstone instance is reused across multiple specialisations.
  - id: CAP_LOCK
    description: EE4002D or EE4002R capstone double-counting consumes the full specialisation overlap budget.
    constraint_type: capstone_lock
    source_ref:
      document: ECE_Specialisations_AY2025_7July2025.pdf
      page: 1
      section: Specialisation overlap and capstone lock
      quote: Double counting of Integrated Project is allowed but consumes the full overlap budget for the Specialisation.
      notes: Also used when one capstone is attempted across multiple capstone-sensitive specialisations.
