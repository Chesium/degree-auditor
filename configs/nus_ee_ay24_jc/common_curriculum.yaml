constraints:
  - id: DEG_TOTAL_160
    description: Degree total is 160 units without TC-in-lieu inflation.
    constraint_type: degree_total
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 2
      section: Degree Requirements
      quote: TOTAL 160 units
  - id: CC_CDE_60
    description: CDE Common Curriculum totals 60 units.
    constraint_type: cc_total
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 1
      section: Common Curriculum
      quote: Common Curriculum CDE 60 units
  - id: UE_40
    description: Unrestricted Electives total 40 units.
    constraint_type: ue_total
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 2
      section: Degree Requirements
      quote: Unrestricted Electives 40 units
  - id: MAJOR_60
    description: EE Major totals 60 units.
    constraint_type: major_total
    source_ref:
      document: L_AY24JC_Checklist_Revised_3TC_4June2025.pdf
      page: 2
      section: Degree Requirements
      quote: Major Requirements 60 units
  - id: CC_CDE2501_DUAL_ROLE
    description: CDE2501 occupies exactly one of Singapore Studies or Sustainable Futures.
    constraint_type: cde2501_dual_role
    source_ref:
      document: FAQ for In-Flight students_For AY24 Non Poly_17Jun2025.pdf
      page: 2
      section: CDE2501
      quote: CDE2501 remains a compulsory course and may be counted under the relevant pillar.
  - id: CC_TC_IN_LIEU_ST
    description: Systems Thinking is satisfied by IE2141 or one TC in lieu, not both.
    constraint_type: cc_tc_in_lieu_st
    source_ref:
      document: EE2_Revised Grad Req Briefing_20June25.pdf
      page: 4
      section: Systems Thinking
      quote: If you have not already read IE2141, you can read an additional technical course to satisfy the Systems Thinking pillar in lieu of IE2141
  - id: CC_TC_IN_LIEU_CN
    description: Creating Narratives is satisfied by CDE2000 or one TC in lieu, not both.
    constraint_type: cc_tc_in_lieu_cn
    source_ref:
      document: FAQ for In-Flight students_For AY24 Non Poly_17Jun2025.pdf
      page: 1
      section: Common Curriculum substitution
      quote: TC may be read in lieu of a CDE Common Curriculum pillar when the listed course has not been taken.
  - id: CC_TC_IN_LIEU_SF
    description: Sustainable Futures may use a TC only when CDE2501 is redirected to Singapore Studies.
    constraint_type: cc_tc_in_lieu_sf
    source_ref:
      document: EE2_Revised Grad Req Briefing_20June25.pdf
      page: 10
      section: Sustainable Futures
      quote: If you have not taken a GESS course, CDE2501 will be count towards the Singapore Studies pillar. You may read 1 TC in lieu of Sustainable Futures
  - id: CC_TC_OVERFLOW_TO_UE
    description: TC substitutions are unit-neutral and overflow to UE when not absorbed by a CC pillar.
    constraint_type: cc_tc_overflow_to_ue
    source_ref:
      document: EE2_Curriculum_Talk_2025_13Aug2025.pdf
      page: 7
      section: TC and UE accounting
      quote: TC substitutions do not increase the 160-unit degree total.
  - id: CC_RC_EXCLUSION
    description: Standard TC-in-lieu substitution table does not apply to RC/college/poly students.
    constraint_type: cc_rc_exclusion
    source_ref:
      document: FAQ for In-Flight students_For AY24 Non Poly_17Jun2025.pdf
      page: 1
      section: Common Curriculum substitution
      quote: The below table is not applicable to students in RC4/UTCP/NUSC/RVRC/Poly graduates.
  - id: PILLAR_OVER_ALLOCATED
    description: A Common Curriculum pillar cannot be satisfied by both its default course and a TC-in-lieu.
    constraint_type: pillar_over_allocated
    source_ref:
      document: EE2_Revised Grad Req Briefing_20June25.pdf
      page: 4
      section: Common Curriculum substitution
      quote: If you have not already read IE2141, you can read an additional technical course in lieu.
  - id: DOUBLE_USE_SINGLE_INSTANCE
    description: A single course instance cannot satisfy two incompatible Common Curriculum pillars.
    constraint_type: double_use_single_instance
    source_ref:
      document: FAQ for In-Flight students_For AY24 Non Poly_17Jun2025.pdf
      page: 2
      section: CDE2501
      quote: CDE2501 remains a compulsory course and is counted under one pillar.
